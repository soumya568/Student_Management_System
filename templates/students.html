
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Students</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            padding: 30px;
        }

        .container {
            background: white;
            padding: 25px;
            border-radius: 10px;
            overflow-x: auto;
        }

        h2 {
            color: #243b55;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            padding: 14px;
            border: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #243b55;
            color: white;
        }

        tr:nth-child(even) {
            background: #f2f2f2;
        }

        a {
            display: inline-block;
            margin-top: 20px;
            background: #243b55;
            color: white;
            padding: 12px 20px;
            text-decoration: none;
            border-radius: 5px;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>All Registered Students</h2>

<form method="GET" action="{{ url_for('view_students') }}">

    <input
        type="text"
        name="search"
        placeholder="Search by ID, Name or Email"
        value="{{ search }}"
    >

    <button type="submit">Search</button>

    <a href="{{ url_for('view_students') }}">Clear Search</a>

</form>


    <table>
        <thead>
            <tr>
                <th>Student ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>Course</th>
                <th>Year</th>
                <th>Actions</th>
            </tr>
        </thead>

        <tbody>
            {% for student in students %}
            <tr>
                <td>{{ student[0] }}</td>
                <td>{{ student[1] }}</td>
                <td>{{ student[2] }}</td>
                <td>{{ student[3] }}</td>
                <td>{{ student[4] }}</td>
                
<td>
    <a href="{{ url_for('edit_student', student_id=student[0]) }}">
        Edit
    </a>

    <form method="POST"
          action="{{ url_for('delete_student', student_id=student[0]) }}"
          onsubmit="return confirm('Are you sure you want to delete this student?');"
          style="display:inline;">

        <button type="submit"
                style="background:red; color:white; padding:10px;">
            Delete
        </button>

    </form>
</td>

            </tr>
            {% else %}
            <tr>
                <td colspan="5">No students registered yet.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

    <a href="{{ url_for('home') }}">Back to Dashboard</a>

</div>

</body>
</html>
