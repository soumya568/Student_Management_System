
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Student</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            padding: 30px;
        }

        .form-container {
            background: white;
            max-width: 450px;
            margin: auto;
            padding: 25px;
            border-radius: 10px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            box-sizing: border-box;
        }

        button {
            background: #243b55;
            color: white;
            padding: 12px;
            border: none;
            width: 100%;
            cursor: pointer;
        }

        a {
            display: block;
            margin-top: 15px;
            text-align: center;
        }
    </style>
</head>

<body>

<div class="form-container">

    <h2>Edit Student Details</h2>

    <form method="POST">

        <input type="text"
               name="name"
               value="{{ student[1] }}"
               placeholder="Student Name"
               required>

        <input type="email"
               name="email"
               value="{{ student[2] }}"
               placeholder="Email Address"
               required>

        <input type="text"
               name="course"
               value="{{ student[3] }}"
               placeholder="Course"
               required>

        <input type="number"
               name="year"
               value="{{ student[4] }}"
               min="1"
               max="6"
               placeholder="Year of Study"
               required>

        <button type="submit">Update Student</button>

    </form>

    <a href="{{ url_for('view_students') }}">
        Back to Students
    </a>

</div>

</body>
</html>
